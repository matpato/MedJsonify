[general]
conversion_method=python
file_type=xml, csv, txt

[folders]
# Base folder for input files (before conversion)
base_input_folder=/opt/airflow/dags/jsonify/input
# Base folder for output JSON files (after conversion)
base_output_folder=/opt/airflow/dags/jsonify/output
# Data folder for state tracking
data_folder = /opt/airflow/dags/jsonify/data

[state_tracking]
# Files to track which items have been processed (prevents duplicates)
xml_processed = /opt/airflow/dags/jsonify/data/xml_processed.txt
csv_processed = /opt/airflow/dags/jsonify/data/csv_processed.txt
txt_processed = /opt/airflow/dags/jsonify/data/txt_processed.txt

[log_files]
# Logging files for monitoring and debugging
log_file=/opt/airflow/dags/jsonify/info/missing_fields_log.txt
unconverted_file=/opt/airflow/dags/jsonify/info/unconverted_files.txt
processed_medications_file=/opt/airflow/dags/jsonify/info/drugs.txt
processing_summary_file=/opt/airflow/dags/jsonify/info/summary.txt

[conversion]
# Conversion settings
preserve_formatting = true
include_metadata = true