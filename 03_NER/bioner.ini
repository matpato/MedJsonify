[info]
# Input data to run ner_entities_batch files. 
# Maintainer: MPato
# Version 2.2 - Clean configuration with no duplications
# Date: January 02, 2026

[SAMPLE]
splitedSize = 1000

[PATH]
# Entity and processing paths
path_to_entities_json = /opt/airflow/dags/NER/data/entities/
path_to_info = /opt/airflow/dags/NER/data/info_process.txt
path2blacklist = /opt/airflow/dags/NER/data/blacklists/blacklist.txt
path2drugbank = /opt/airflow/dags/NER/ner_drugbank.py

# Input/Output directories
input_json_dir = /opt/airflow/dags/jsonify/output/
preprocessing_output_dir = /opt/airflow/dags/NER/data/preprocessing/

# DrugBank vocabulary file
drugbank_file = /opt/airflow/dags/NER/data/drugbank_vocabulary.csv

[ONTO]
# Active lexicons (comma-separated)
# Supported: doid, chebi, hp (or hpo), ordo
active_lexicons = doid, ordo, chebi, hp,

# Update ontologies (yes: 1 | no: 0)
update = 1

[VOCABULARY]
# External data sources
# DrugBank vocabulary for drug name matching
drugbank_url = https://go.drugbank.com/releases/5-1-13/downloads/all-drugbank-vocabulary
output_folder = /opt/airflow/dags/NER/data

# Note: Orphanet/ORDO URL is defined in [ONTOLOGIES] section below
# Access it programmatically via get_ontology_config('ordo')['url']

[ONTOLOGIES]
# Ontology URLs (for automatic download)
# Single source of truth for each ontology

# Disease Ontology
doid_url = http://purl.obolibrary.org/obo/doid.owl
doid_name = doid
doid_description = Disease Ontology - Human disease classifications

# ChEBI - Chemical Entities of Biological Interest
chebi_url = http://purl.obolibrary.org/obo/chebi/chebi_lite.owl
chebi_name = chebi
chebi_description = ChEBI Lite - Chemical entities of biological interest

# Human Phenotype Ontology
hpo_url = http://purl.obolibrary.org/obo/hp.owl
hpo_name = hpo
hpo_description = Human Phenotype Ontology - Phenotypic abnormalities

# Orphanet Rare Disease Ontology (ORDO)
# Note: This is the ONLY place where Orphanet URL is defined
ordo_url = https://www.orphadata.com/data/ontologies/ordo/last_version/ordo_orphanet.owl
ordo_name = ordo
ordo_description = Orphanet Rare Disease Ontology

[STANDALONE_NER]
# Standalone NER configuration
# Single source of truth for ontology directories
data_dir = /opt/airflow/dags/NER/ontologies/data
scripts_dir = /opt/airflow/dags/NER/ontologies/scripts